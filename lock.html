<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Continue - Tamilcrafters Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;font-family:'Baloo 2',sans-serif;color:#fff;
 background:radial-gradient(1200px 700px at 20% 10%,#2b1a5c 0%,transparent 60%),radial-gradient(900px 600px at 85% 90%,#0f3a2c 0%,transparent 60%),#05070a}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;opacity:.5}
.o1{width:360px;height:360px;background:radial-gradient(circle,#FFD23F88 0%,transparent 70%);top:-110px;left:-90px}
.o2{width:340px;height:340px;background:radial-gradient(circle,#8B5CF688 0%,transparent 70%);bottom:-100px;right:-90px}
.card{position:relative;z-index:1;max-width:400px;width:100%;text-align:center;padding:34px 22px 22px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.25);}
.icon{width:84px;height:84px;margin:-76px auto 12px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:linear-gradient(145deg,#FFD23F,#FF8A00);box-shadow:0 12px 34px #FFD23F77}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:#FFD23F22;color:#FFD23F;border:1px solid #FFD23F55;margin-bottom:10px}
h1{margin:0 0 8px;font-size:1.7rem;line-height:1.15;font-weight:800;background:linear-gradient(90deg,#fff,#FFD23F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{margin:0 0 16px;font-size:.95rem;line-height:1.55;color:rgba(255,255,255,.82)}
ul{list-style:none;margin:0 0 20px;padding:0;text-align:left;display:grid;gap:8px}
li{display:flex;gap:10px;align-items:center;font-size:.88rem;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
li b{flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;background:#FFD23F;color:#1a1000}
#go{position:relative;overflow:hidden;width:100%;padding:17px 16px;border:0;border-radius:18px;font:inherit;font-weight:800;font-size:1.15rem;letter-spacing:.02em;cursor:pointer;color:#1a1000;background:linear-gradient(180deg,#FFD23F,#FF8A00);box-shadow:0 6px 0 #a85a00,0 16px 34px #FFD23F66;touch-action:manipulation;transition:transform .08s}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #a85a00,0 8px 20px #FFD23F55}
#go[disabled]{filter:grayscale(.2);opacity:.85}
.note{margin-top:12px;font-size:.74rem;color:rgba(255,255,255,.55);word-break:break-all}
.retry{display:none;margin-top:12px;font-size:.82rem;color:rgba(255,255,255,.8)}
.retry a{color:#FFD23F;font-weight:700}
.err{color:#ff9b9b}
@media(max-width:480px){body{padding:12px}.card{padding:30px 16px 18px}h1{font-size:1.5rem}}
@media(pointer:coarse) and (min-width:700px){.card{zoom:1.7}}
</style>
</head>
<body>
<div class="bg"><span class="orb o1"></span><span class="orb o2"></span>
</div>
<main class="card" id="card">
  <div class="icon">🌐</div>
  <div class="tag" id="tag">Your link is ready</div>
  <h1 id="title">Continue to your link</h1>
  <p id="lead">Your link is ready. Unlock it with one quick tap.</p>
  <ul>
    <li><b>1</b><span>Tap the unlock button below</span></li>
    <li><b>2</b><span id="s2">Support the creator with one free tap</span></li>
    <li><b>3</b><span id="s3">You are taken to your link</span></li>
  </ul>
  <button type="button" id="go">🔓 Unlock Website Link</button>
  <div class="retry" id="retry">Link didn't open? <a id="rl" href="#" target="_blank" rel="noopener">Tap here</a></div>
  <div class="note" id="note">by Tamilcrafters Studio</div>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var DL_HOSTS = ["curseforge.com","forgecdn.net"];
  var go = document.getElementById("go"), note = document.getElementById("note");
  function parse(u){ try{ var x = new URL(u); return (x.protocol==="https:"||x.protocol==="http:") ? x : null; }catch(e){ return null; } }
  function hostOk(x, list){ return list.some(function(h){ return x.hostname===h || x.hostname.slice(-(h.length+1))==="."+h; }); }
  function broken(title, lead, msg){
    go.disabled = true;
    document.getElementById("tag").textContent = "Unavailable";
    document.getElementById("title").textContent = title;
    document.getElementById("lead").textContent = lead;
    note.className = "note err"; note.textContent = msg;
  }
  function ready(dl, to, name){
    var d = parse(dl), t = parse(to);
    if(!d || !hostOk(d, DL_HOSTS) || !t){ return broken("Link is broken", "This lock link is missing or invalid. Ask the creator for a new one.", "Invalid or missing link."); }
    var label = (name || "").trim().slice(0,40) || t.hostname.replace(/^www\./,"");
    document.getElementById("title").textContent = "Continue to " + label;
    document.getElementById("lead").textContent = "Your link to " + label + " is ready. Unlock it with one quick tap.";
    document.getElementById("s3").textContent = "You are taken to " + label;
    note.textContent = "Opens: " + t.hostname + " \u2022 by Tamilcrafters Studio";
    document.getElementById("rl").href = t.href;
    go.disabled = false;
    go.addEventListener("click", function(){
      go.disabled = true; go.textContent = "\u2705 Unlocked! Opening\u2026";
      var f = document.createElement("iframe");
      f.style.display = "none"; f.src = d.href; document.body.appendChild(f);
      document.getElementById("retry").style.display = "block";
      setTimeout(function(){ location.href = t.href; }, 2500);
    });
  }
  var id = (q.get("id") || "").trim();
  if(id){
    go.disabled = true;
    document.getElementById("title").textContent = "Checking your link\u2026";
    fetch("links.json?t=" + Date.now(), {cache:"no-store"}).then(function(r){
      if(!r.ok){ throw new Error("http"); }
      return r.json();
    }).then(function(j){
      var e = null, list = (j && j.links) || [];
      for(var i=0;i<list.length;i++){ if(list[i].id === id){ e = list[i]; break; } }
      if(!e){ return broken("Link not available", "This link is no longer active. Ask the creator for a new one.", "Link expired or removed."); }
      ready(e.pack, e.site, e.label);
    }).catch(function(){
      broken("Could not load link", "Check your connection and reload this page.", "Network problem.");
    });
    return;
  }
  ready(q.get("dl") || "", q.get("to") || "", q.get("n"));
})();
</script>
</body>
</html>
